name: deploy

on:
  push:
    branches: [master]

# A second push while the first is still deploying would race wrangler.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # The gate. check:content reads the markdown, the build compiles every
      # twoslash snippet, so a chapter whose code stopped typechecking fails
      # here rather than reaching a reader.
      - run: bun run check:content
      - run: bun run lint
      - run: bun run types:check
      - run: bun run test

      - run: bun run build

      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
